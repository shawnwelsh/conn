<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>belay — web debug deck</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px; background: #09090b; color: #d4d4d8;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start;
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: #a1a1aa; }
  #grid {
    display: grid; grid-template-columns: repeat(5, 96px); gap: 10px;
    padding: 18px; background: #18181b; border-radius: 16px; border: 1px solid #27272a;
  }
  .key {
    width: 96px; height: 96px; border-radius: 10px; border: none; padding: 0;
    background: #0a0a0a; cursor: pointer; overflow: hidden;
    transition: transform 60ms ease;
  }
  .key:active { transform: scale(0.93); }
  .key img { width: 100%; height: 100%; display: block; image-rendering: auto; }
  #status { margin-top: 10px; font-size: 12px; color: #71717a; }
  #status .up { color: #4ade80; }
  #status .down { color: #f87171; }
  #panel {
    flex: 1; min-width: 320px; max-width: 640px; background: #18181b;
    border: 1px solid #27272a; border-radius: 16px; padding: 18px;
    font-size: 12px;
  }
  #panel pre {
    margin: 0; white-space: pre-wrap; word-break: break-all;
    max-height: 70vh; overflow-y: auto; color: #a1a1aa;
  }
  .hint { font-size: 11px; color: #52525b; margin-top: 8px; }
</style>
</head>
<body>
  <div>
    <h1>belay · web debug deck</h1>
    <div id="grid"></div>
    <div id="status">connecting…</div>
    <div class="hint">click = press · double-click = double-tap (row 1: focus)</div>
  </div>
  <div id="panel">
    <h1>bridge state</h1>
    <pre id="state">–</pre>
  </div>

<script>
  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");
  const stateEl = document.getElementById("state");
  const keys = [];

  for (let slot = 0; slot < 15; slot++) {
    const btn = document.createElement("button");
    btn.className = "key";
    btn.title = "key " + slot;
    const img = document.createElement("img");
    img.alt = "";
    btn.appendChild(img);
    // Raw key down/up only — the bridge measures the interval to classify
    // tap / double-tap / long-press, exactly as it will for hardware keys.
    // Hold the mouse button down to produce a long-press.
    let down = false;
    const sendDown = () => { if (!down) { down = true; send({ type: "down", slot, at: Date.now() }); } };
    const sendUp = () => { if (down) { down = false; send({ type: "up", slot, at: Date.now() }); } };
    btn.addEventListener("mousedown", (e) => { e.preventDefault(); sendDown(); });
    btn.addEventListener("mouseup", sendUp);
    btn.addEventListener("mouseleave", sendUp); // release if dragged off
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); sendDown(); }, { passive: false });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); sendUp(); }, { passive: false });
    grid.appendChild(btn);
    keys.push(img);
  }

  let ws = null;
  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => {
      statusEl.innerHTML = '<span class="up">● connected</span>';
      send({ type: "identify", client: "webdeck" });
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "render") {
        for (const k of msg.keys) {
          if (k.slot >= 0 && k.slot < 15) keys[k.slot].src = k.image;
        }
      }
    };
    ws.onclose = () => {
      statusEl.innerHTML = '<span class="down">● disconnected — retrying…</span>';
      setTimeout(connect, 1500);
    };
  }
  connect();

  async function pollState() {
    try {
      const res = await fetch("/api/state");
      const state = await res.json();
      for (const s of state.sessions) delete s.events; // keep the panel readable
      stateEl.textContent = JSON.stringify(state, null, 2);
    } catch { /* bridge restarting */ }
  }
  setInterval(pollState, 2000);
  pollState();
</script>
</body>
</html>
