name: CI

# The merge gate: every PR must typecheck and pass the suite before it can land.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    # Conn is Windows-only (Windows Terminal, AutoHotkey, the desktop app's
    # window model) and its tests use Windows paths — so CI runs on the
    # platform it ships on, not a Linux runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p packages/bridge
      - name: Test
        run: npm test --workspaces --if-present
